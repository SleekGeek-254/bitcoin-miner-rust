[package]
name = "bitcoin-miner-rust"
version = "0.1.0"
edition = "2021"

[build-dependencies]
cc = "1.0"

[dependencies]
anyhow = "1.0"
clap = { version = "4.0", features = ["derive"] }
hex = "0.4"
rustacuda = "0.1.3" 
rustacuda_core = "0.1.2"  
rustacuda_derive = "0.1.2"  

nvml-wrapper = "0.9"           # or latest version that works for you
chrono         = { version = "0.4", features = ["serde"] }   # for nice timestamps
serde          = { version = "1.0", features = ["derive"] }
serde_json     = "1.0"

indicatif = "0.17"
rayon = "1.8"
num-bigint = "0.4"
num-traits = "0.2"
sha2 = "0.10"